<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Leaderboard with offline and global modes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1000" height="300" rx="18" fill="#0B0221"/>
<rect x="40" y="40" width="450" height="220" rx="14" transform="translate(9,10)" fill="#ff2bd6" opacity="0.25"/>
