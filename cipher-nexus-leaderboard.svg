<rect x="190" y="208" width="170" height="22" rx="5" fill="#ff2bd6" opacity="0.9"><animate attributeName="width" values="0;170;170;0" keyTimes="0;0.3;0.9;1" dur="6s" begin="0.8s" repeatCount="indefinite"/></rect>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<g><rect x="540" y="40" width="420" height="100" rx="14" transform="translate(8,9)" fill="#00f0ff" opacity="0.22"/>
<rect x="540" y="40" width="420" height="100" rx="14" fill="#12052b" stroke="#00f0ff" stroke-width="2"><animate attributeName="stroke-opacity" values="1;0.25;1" dur="6s" repeatCount="indefinite"/></rect>
<text x="566" y="74" font-size="13" font-weight="800" fill="#00f0ff" letter-spacing="4">OFFLINE MODE · DEFAULT</text>
<text x="566" y="102" font-size="15" fill="#e9d5ff">Zero setup. Scores live in this browser only.</text>
<text x="566" y="124" font-size="12" fill="#7c6aa8">No config needed.</text></g>
<g><rect x="540" y="160" width="420" height="100" rx="14" transform="translate(8,9)" fill="#ffe600" opacity="0.2"/>
